spring.application.name: summarizer

server:
  port: 8092
spring:
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://openrouter.ai/api/v1

      chat:
        model: nvidia/nemotron-3-ultra-550b-a55b:free
        temperature: 0.1

      timeout: 240s
      max-retries: 5


kafka:
  url: ${LOCALHOST:kafka}:9092
  group-id: summarizer-group