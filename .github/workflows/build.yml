name: Build & Push Docker Image

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        run: |
          docker build -t appleapplenotdead/task-tracker-summarizer:${{ github.sha }} .
          docker push appleapplenotdead/task-tracker-summarizer:${{ github.sha }}
          
          docker tag appleapplenotdead/task-tracker-summarizer:${{ github.sha }} appleapplenotdead/task-tracker-summarizer:latest
          docker push appleapplenotdead/task-tracker-summarizer:latest